# =========================================================================
# rs2546890 → UKBB MRI white-matter / myelin IDP association — config
# Edit paths below to match your local installation. All scripts read this
# file via --config. Empty string ("") means "not provided — code will skip
# or fall back to an alternate path described in src/01_extract_variant.py
# and the README."
# =========================================================================

project:
  output_dir: "./results"                # results / sample_counts / report.md land here
  figures_dir: "./figures"
  logs_dir: "./logs"
  intermediate_dir: "./results/intermediate"
  random_seed: 12345
  dry_run: false                         # 00 runs full; 01-05 only validate. CLI flag --dry-run also forces this.
  test_mode: false                       # cap to max_test_phenotypes during dev
  max_test_phenotypes: 50
  overwrite: false                       # if false, writes go to a timestamped subdir of output_dir
  conda_env: "Python_Analysis"           # sourced by scripts/run_all.sh

inputs:
  # ---- phenotype side ----
  phenotype_file: ""                     # optional single wide pheno CSV (alternative to mri_pheno_tsv_dirs+basket)
  # Official UKB Data Dictionary — used to label phenotypes/covariates with the showcase Field text.
  data_dictionary_file: "/net/bmc-lab5/data/kellis/group/tanigawa/data/ukb21942/pheno/downloads/Data_Dictionary_Showcase.csv"
  basket_tab: "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Basket_Files/ukb675079.tab"
  mri_pheno_tsv_dirs:
    - "/net/bmc-lab4/data/kellis/users/mabdel03/files/Isolation_Genetics/GWAS/phenotypes/MRI_Phenos/Pheno_Files"
    - "/net/bmc-lab4/data/kellis/users/mabdel03/files/Isolation_Genetics/GWAS/phenotypes/Run2_Phenos/Create_Phenos/MRI"
  extract_phenotype_sh: "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Scripts/UKBB-SI-Genetics/1_Phenotype_Creation/extract_phenotype.sh"

  # ---- genotype side ----
  # Primary path: imputed pgen (GRCh38). If pgen_prefix is set, 01_extract_variant.py uses plink2 on it.
  pgen_prefix: "/net/bmc-lab5/data/kellis/group/tanigawa/data/ukb21942/imp/ukb_imp"
  variant_metadata_file: "/net/bmc-lab5/data/kellis/group/tanigawa/data/ukb21942/imp/ukb_mfi_v3.tsv.zst"

  # Fallback paths (used only if pgen_prefix is empty / extraction fails)
  chr5_bgen: ""
  sample_file: ""

  # Skip extraction entirely if you have your own dosage CSV (cols: eid, dosage_A, [genotype])
  preextracted_variant_dosage_file: ""

  # ---- covariates / sample QC ----
  # UKB Sample-QC table (SQC). Has FID/IID, population, population_MM, sex, age,
  # genotyping_array, used_in_pca_calculation, pass_QC_filter, sr_WB, UKB_PC1..PC40.
  # Step 03 reads PCs/age/sex/array from here; step 04 uses the SQC flags for
  # ancestry + unrelated filtering (no separate ancestry_relatedness_file needed).
  genetic_covariates_file: "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Scripts/ukb21942/sqc/sqc.20220316.tsv.gz"
  imaging_confounds_file: ""             # optional Smith-style UKB Resource 1977 file (not present locally)
  # Optional KING relatedness pairs (.dat or .dat.gz, cols: ID1 ID2 HetHet IBS0 Kinship).
  # If set, step 04 graph-prunes pairs with Kinship >= sample.kinship_threshold.
  # If empty, step 04 falls back to SQC's used_in_pca_calculation flag.
  relatedness_file: "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Scripts/ukb21942/sqc/downloads/ukb_rel_a21942_s488172.dat.gz"
  # Legacy single-file combined keep list (eid, ancestry_label, kin_keep). Empty here
  # because we use the SQC + KING combo above instead.
  ancestry_relatedness_file: ""

variant:
  rsid: "rs2546890"
  chr: 5
  pos_grch38: 159332892
  pos_grch37: 158759900                  # IL12B locus; UKB imputation v3 pgen is GRCh37-native
  effect_allele: "A"
  other_allele: "G"
  # Which build is the genotype source on? Affects which pos_* is used to query.
  # "GRCh37" or "GRCh38". Auto-falls-back to whichever match the pgen returns.
  pgen_build: "GRCh37"
  min_info: 0.8
  max_missing_rate: 0.05
  hardcall_probability_threshold: 0.9

sample:
  restrict_to_unrelated: true
  restrict_to_ancestry: true
  # "White British" maps to SQC population_MM == "WB_MM" (also matched by population == "WB" or sr_WB == 1).
  # "EUR" maps to any of population in {WB,NBW} (broader European set).
  ancestry_label: "White British"
  # KING kinship threshold for graph pruning if relatedness_file is set.
  # 0.0884 = 3rd-degree relatives or closer (standard UKB cutoff).
  kinship_threshold: 0.0884
  exclude_neurological_disease_if_available: false

phenotypes:
  require_manual_manifest_approval: false   # set true after first run to lock the manifest
  primary_terms:
    - "fractional anisotropy"
    - "mean diffusivity"
    - "radial diffusivity"
    - "intracellular volume fraction"
    - "isotropic volume fraction"
    - "orientation dispersion"
    - "NODDI"
    - "L1"
    - "L2"
    - "L3"
  secondary_terms:
    - "white matter hyperintensity"
    - "WMH"
    - "T2 FLAIR"
  exploratory_terms:
    - "diffusion"
    - "tract"
  prioritize_regions:
    - "corpus callosum"
    - "genu"
    - "splenium"
    - "internal capsule"
    - "corticospinal"
    - "superior longitudinal"
    - "cingulum"
    - "optic radiation"
    - "posterior thalamic"
    - "corona radiata"

covariates:
  genetic_pc_count: 20
  include_age2: true
  include_age_by_sex: true
  required_terms:
    - "age at imaging"
    - "sex"
    - "genotyping array"
    - "genetic principal component"
  optional_terms:
    - "assessment centre"
    - "imaging centre"
    - "head size"
    - "motion"
    - "table position"
    - "acquisition date"
  # UKB field-id hints (used if metadata-term search fails). Override per-cohort as needed.
  field_hints:
    age_at_imaging: ["21003-2.0", "21022"]
    sex: ["31-0.0", "31"]
    imaging_centre: ["54-2.0"]
    head_size_scaling: ["25000-2.0"]
    head_motion_dmri: ["25746-2.0"]      # number of dMRI outlier slices (true dMRI QC proxy)
    array: ["22000-0.0"]
    acquisition_date: ["53-2.0"]
    pc_prefix: "22009-0."                # PCs are 22009-0.1 ... 22009-0.40

models:
  primary_model: "ols_additive"
  use_lmm: false                         # legacy flag; superseded by models.engine below. Kept for back-compat.
  phenotype_transform: "inverse_rank_normal"
  outlier_z_threshold: 6
  multiple_testing:
    - "bonferroni"
    - "bh_fdr"
  run_genotypic_sensitivity: true
  run_recessive_sensitivity: false
  run_dominant_sensitivity: false
  # ----- hierarchical refactor: engine routing -----
  engine: "regenie+ols"                  # ols | regenie | bolt | regenie+ols | bolt+ols | all
  ols_robust_vcov: "nonrobust"           # nonrobust | HC0 | HC1 | HC2 | HC3
  compute_diagnostics: true              # write model_diagnostics_summary.csv

# =========================================================================
# Hierarchical refactor (D1–D11 of /home/mabdel03/.claude/plans/lucky-napping-moore.md)
# =========================================================================

families:
  # Each phenotype is tagged with `family` in addition to `panel`. Per-family
  # Bonferroni + BH-FDR is computed independently across families.
  #   primary     — pre-registered myelin-sensitive MRI (MTR, MTsat, MWF, qT1) — empty in current extract
  #   secondary   — biological composites + ROI PCA scores
  #   exploratory — all single-IDP dMRI metrics (the existing flat PheWAS)
  #   controls    — WMH and any QC outcomes
  primary_terms:
    - "magnetisation transfer"
    - "magnetization transfer"
    - "MTR"
    - "MTsat"
    - "MWF"
    - "myelin water fraction"
    - "qT1"
    - "quantitative T1"
    - "T2*"
    - "R2*"
  controls_terms:
    - "white matter hyperintensity"
    - "WMH"
    - "T2 FLAIR"

composites:
  standardize: "zscore"                  # zscore | inrt
  min_components: 2                      # require at least N non-missing components per composite
  rescale_by_sqrt_n: true                # divide by sqrt(n_present) so partial composites are comparable
  # Composite definitions — each is a signed weighted sum of standardized
  # component metrics within a single tract. See plan D3 for the biology.
  definitions:
    demyelination_like:
      RD: +1
      MD: +1
      FA: -1
      ICVF: -1
      ISOVF: +1
    free_water_like:
      MD: +1
      ISOVF: +1
      L1: +1
      L2: +1
      L3: +1
    axonal_loss_like:
      L1: -1
      FA: -1
      ICVF: -1
    tract_geometry_like:
      OD: -1
      FA: +1
      MO: +1                             # optional — composite still computed if MO missing (min_components rule)

roi_pca:
  enabled: true
  max_col_missing_rate: 0.5              # drop metric col within tract if >50% missing in QC sample
  max_row_missing_rate: 0.3              # drop eid if >30% of remaining cols missing
  pc2_min_evr: 0.10                      # keep PC2 only if it explains ≥10% variance
  # Tracts to run ROI-PCA on. Each is matched as a substring against the
  # tract slug parsed in step 02 (case-insensitive). Use any-of matching so
  # e.g. "corpus callosum" picks up genu, body, splenium.
  tracts:
    - "superior cerebellar peduncle"
    - "corpus callosum"
    - "genu"
    - "splenium"
    - "internal capsule"
    - "corticospinal"
    - "posterior thalamic"
    - "inferior longitudinal fasciculus"
    - "sagittal stratum"

lmm:
  # Mixed-model engine settings. Activated when models.engine includes
  # regenie or bolt.
  threads_step1: 16
  threads_step2: 8
  bsize_step1: 1000
  bsize_step2: 400
  min_n_per_phenotype: 500               # drop phenotype from LMM run if non-NaN n < this
  drop_kinship_above: 0.354              # MZ-twin / duplicate threshold; LMM keeps everyone else
  scope_families:                        # which families go to LMM (REGENIE/BOLT)
    - "primary"                          # myelin-sensitive MRI (empty in current extract)
    - "secondary"                        # composites + ROI PCs (~316 phenotypes)
    - "controls"                         # WMH
    # exploratory (~694 single IDPs) is OLS-only by default — flip below to include
  scope_include_exploratory: false       # set true to also LMM all single IDPs (long compute!)
  max_phenotypes: 5                      # 0 = no cap. Cap LMM to 5 phenotypes for the demo run.
                                         # Increase or set 0 for production once REGENIE
                                         # wall-clock budget is sorted (~30 min/pheno on this HM3 BED).
  target_variant_id: "5:158759900:A:G"   # step-2 --extract content (rs2546890 on GRCh37 pgen)
  regenie:
    binary: "/home/mabdel03/data/conda_envs/regenie_env/bin/regenie"  # v3.4.1, no libmvec needed
    hm3_bed_prefix: "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Scripts/ukb21942/geno/ukb_genoHM3/ukb_genoHM3_bed"
    model_snps:    "/home/mabdel03/data/files/Isolation_Genetics/GWAS/Scripts/ukb21942/geno/ukb_genoHM3/ukb_genoHM3_modelSNPs.txt"
    step2_pgen_prefix: "/net/bmc-lab5/data/kellis/group/tanigawa/data/ukb21942/imp/ukb_imp"
    reuse_step1: true                    # if pheno set hash matches, skip step 1
    skip_step1: false                    # force-skip even without hash match (debugging)
    min_mac: 20
    min_info: 0.8
    extra_ld_library_path: ""            # e.g. /path/to/glibc/lib if libmvec.so.1 missing
  bolt:
    binary: "/home/mabdel03/data/software/BOLT-LMM_v2.5/bolt"
    ld_scores:   "/home/mabdel03/data/software/BOLT-LMM_v2.5/tables/LDSCORE.1000G_EUR.GRCh38.tab.gz"
    genetic_map: "/home/mabdel03/data/software/BOLT-LMM_v2.5/tables/genetic_map_hg19_withX.txt.gz"
    threads: 16
    include_single_idps: false           # BOLT default scope = composites + ROI PCs only
    regen_bgen: false                    # if true, materialize chr5 BGEN from pgen via plink2 (~1 hr)
